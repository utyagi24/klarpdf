# GENERATED by packaging/mcp/mcpb/build_mcpb.py from requirements-mcp.txt — do not hand-edit.
#
# This is the one place in the project where dependencies are *declared* rather than installed from
# a lock, and only because the MCPB format requires it: the bundle resolves online at install time,
# so the manifest of what to fetch has to travel with it. Every entry is an `==` pin covering the
# whole transitive set, so two users installing a month apart get the same environment.
#
# NOTE: what this file installs is NOT covered by the repo's pip-audit steps, which audit
# requirements-mcp.txt on the pip/pipx path. It is generated *from* that lock, so the two agree at
# build time — but a Desktop install resolves fresh (PLAN.md §Dependencies & packaging).
#
# `requires-python` is the window the ROOT pyproject.toml states and manifest.json restates in
# node-semver; all three are kept in step by tests/test_mcp_packaging.py. See the root file for what
# sets each bound (M132) — floor 3.11 from rpds-py, ceiling 3.15 chosen so the pinned C and Rust
# packages always have a wheel.
[project]
name = "klarpdf-mcp"
version = "0.18.0"
description = "KlarPDF's PDF engine as MCP tools — read, transform, verifiably redact. Offline."
requires-python = ">=3.11,<3.15"
dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "attrs==26.1.0",
    "cffi==2.1.1",
    "click==8.4.2",
    "cryptography==50.0.0",
    "h11==0.16.0",
    "httpcore2==2.10.0",
    "httpx2==2.10.0",
    "idna==3.18",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "mcp==2.0.0",
    "mcp-types==2.0.0",
    "opentelemetry-api==1.44.0",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pyjwt[crypto]==2.13.0",
    "pymupdf==1.27.2.3",
    "python-multipart==0.0.32",
    "referencing==0.37.0",
    "rpds-py==2026.6.3",
    "sse-starlette==3.4.8",
    "starlette==1.6.0",
    "truststore==0.10.4",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn==0.52.1",
]

[project.scripts]
klarpdf-mcp = "klarpdf.mcp_bridge.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["klarpdf", "klarpdf.mcp_bridge", "klarpdf.model", "klarpdf.util"]
