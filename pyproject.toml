[project]
name = "klarpdf"
dynamic = ["version"]
# What a PyPI visitor reads. The old line — "Local, offline, native-Windows PDF viewer + page
# editor" — described the app, which this distribution does not contain: an install is the MCP
# bridge and the GUI-free core it stands on (see `[tool.setuptools] packages`). The Windows viewer
# ships as a PyInstaller-frozen installer and is never pip-installed.
description = "KlarPDF's PDF engine as MCP tools — read PDFs and their structure (headings, links, tables), add bookmarks, transform, and verifiably redact. Local and offline."
readme = "klarpdf/mcp_bridge/README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES"]
authors = [{ name = "utyagi24", email = "12071588+utyagi24@users.noreply.github.com" }]
keywords = ["pdf", "mcp", "redaction", "split", "merge", "forms", "bookmarks", "tables", "offline", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]

# THIS GOVERNS THE BRIDGE, NOT THE APP (M132). What `requires-python` gates is a `pip`/`pipx` install
# of this project, and that install is the MCP bridge — the Windows GUI is PyInstaller-frozen from
# requirements-win.txt and is never pip-installed. So widening this does not touch the app's build,
# and CLAUDE.md §Gotchas "Windows Python must be python.org 3.12.x" stays true of the ship path.
#
# It said `>=3.12,<3.13` until M132: a single-version window, inherited from the app rather than
# measured, which made "have exactly 3.12 installed" a prerequisite for every bridge user on every
# OS. Nothing in the dependency set ever asked for that. Measured against the pinned transitive set:
#
#   FLOOR 3.11 — set by exactly one package, `rpds-py` (>=3.11), which arrives transitively via
#   jsonschema <- mcp. Both direct dependencies declare >=3.10, and the payload (mcp_bridge/, model/,
#   util/, version.py) parses clean at feature_version=(3,10) — no PEP 695, nothing 3.11-only. So
#   3.11 is the lock's floor, not the code's, and dropping to 3.10 would mean unpinning rpds-py.
#
#   CEILING 3.15 — chosen, not forced. Nothing in the set imposes one: PyMuPDF ships cp310-abi3
#   (one wheel covering CPython 3.10 and every later version), cryptography cp311-abi3, and cffi,
#   pydantic-core and rpds-py ship discrete wheels through cp314/cp315. The bound is one above the
#   newest Python the pins are actually built for, so a bundle cannot be installed onto an
#   interpreter no wheel exists for and fall back to a source build of C and Rust on a user's
#   machine. RELEASE.md §4 carries the runbook that raises it.
#
# The claim is enforced, not asserted: the `bridge-pyver` job in .github/workflows/test.yml runs
# tests/test_mcp_*.py on every Python in the window, so the floor and the ceiling are both tested
# rather than declared. Widening it again means adding a runner there first.
requires-python = ">=3.11,<3.15"
# The GUI's dependency VERSIONS have a single source of truth in requirements.in (compiled to
# requirements-win.txt for the Windows ship and requirements-dev.txt for WSL dev). They are
# intentionally NOT duplicated here. See PLAN.md "Packaging, dependencies & installer".
#
# `dependencies` below covers what an INSTALL of this project is: the MCP bridge. `packages` is
# mcp_bridge + model + util, and the only entry point is klarpdf-mcp — the Windows app is never
# pip-installed, it is PyInstaller-frozen from the hashed lock.
#
# M42 left this list out, reasoning that the project installs from a lock and never resolves from
# here. That was right for the app and wrong for a package whose whole purpose is a console script:
# the built metadata carried **zero Requires-Dist**, so the `pipx install .` the README documents
# produced a `klarpdf-mcp` that died on `import mcp`. Found by hand, not by CI — which is why
# tests/test_mcp_packaging.py now builds the metadata and asserts these are in it.
#
# FLOORS here, PINS in requirements-mcp.txt. That is the ordinary split: this file says what the
# code needs to work, the lock says the exact set we audited and recommend. A test asserts both name
# the same packages, and that the lock's pin satisfies the floor here.
#
# The PyMuPDF floor is the version the app ships and the bridge is compiled against (M115), not the
# older floor it carried while the two locks silently drifted apart. It is still a floor rather than
# a pin because this is package metadata: an exact pin here would conflict with anything a user
# co-installs. That leaves one gap on purpose — `pipx install .` resolves to the *newest* PyMuPDF,
# not ours — carried in PROGRESS.md §Open follow-ups.
#
# PINNED, NOT FLOORED, AND GENERATED (M135). These become `Requires-Dist` in the published wheel,
# which is what `pip`, `pipx`, `uvx` and `install.py` all resolve against — so floors here would
# hand a `uvx` install and a lock install two different dependency sets from one package. That is a
# library's convention, and this is an application: installed into an environment of its own by
# `uvx`/`pipx`, there is nothing to co-install with. Pinning makes the audited set what every route
# installs, and `pip-audit` already scans requirements-mcp.txt.
#
# The trade accepted knowingly: `pip install klarpdf` into a shared environment will conflict
# loudly. That is correct for an application, and it is why the docs name uvx/pipx/install.py.
#
# Regenerate with `python packaging/mcp/pypi/sync_pins.py`; `--check` is what CI runs. Do not edit
# between the sentinels — the block is replaced wholesale, so a hand edit is silently reverted.
dependencies = [
    # BEGIN GENERATED PINS — packaging/mcp/pypi/sync_pins.py, from requirements-mcp.txt
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "attrs==26.1.0",
    "cffi==2.1.1",
    "click==8.4.2",
    "cryptography==50.0.0",
    "h11==0.16.0",
    "httpcore2==2.12.0",
    "httpx2==2.12.0",
    "idna==3.18",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "opentelemetry-api==1.45.2",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pyjwt[crypto]==2.15.1",
    "pymupdf==1.27.2.3",
    "python-multipart==0.0.32",
    "referencing==0.37.0",
    "rpds-py==2026.6.3",
    "sse-starlette==3.4.8",
    "starlette==1.6.0",
    "truststore==0.10.4",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn==0.52.1",
    # END GENERATED PINS
]

# The project's FIRST console script (M42). It is the MCP bridge's entry point and nothing else;
# there is deliberately no general-purpose CLI (PLAN.md §Dependencies & packaging — a second
# permanent entry point for an audience that has not asked for one).
# What PyPI renders as the sidebar links. Documentation points at the bridge README rather than the
# root one: an install is the bridge, and the root README is the Windows app's shop window.
[project.urls]
Homepage = "https://github.com/utyagi24/klarpdf"
Documentation = "https://github.com/utyagi24/klarpdf/blob/main/klarpdf/mcp_bridge/README.md"
Source = "https://github.com/utyagi24/klarpdf"
Issues = "https://github.com/utyagi24/klarpdf/issues"
Changelog = "https://github.com/utyagi24/klarpdf/releases"

[project.scripts]
klarpdf-mcp = "klarpdf.mcp_bridge.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# An install carries the bridge and the GUI-free core it stands on — and NOT the GUI. That is the
# quarantined seam expressed as a package boundary: `pip install klarpdf` for the bridge pulls no
# PySide6, matching what tests/test_mcp_no_qt.py asserts at runtime. Nothing inside klarpdf/ imports
# Qt at all, which tests/test_mcp_packaging.py checks (M147).
[tool.setuptools]
packages = ["klarpdf", "klarpdf.mcp_bridge", "klarpdf.model", "klarpdf.util"]

[tool.setuptools.dynamic]
version = { attr = "klarpdf.version.__version__" }

# Ruff, the linter (M167). The strategy, which rules each part of the repository gets, and why, are in
# PLAN.md §Linting, dead code and type checking. This block is only the configuration.
[tool.ruff]
# One version, one answer: any other Ruff (an editor's bundled copy, say) refuses to run rather than
# report something CI does not. It must equal the pin in requirements-dev.txt, and
# tests/test_lint_config.py checks that, so a bump changes both in one commit.
required-version = "==0.17.4"
# The wheel's floor (`requires-python`), for the whole repository, the app included (M168). Code moves
# from the app into klarpdf/ when the bridge needs it (the markup palette did in M101), so syntax newer
# than 3.11 in the app would break the wheel on the day it moved.
target-version = "py311"
# The ceiling E501 checks (M171). Ruff's own default is 88, the width its formatter wraps to. This
# project has no formatter (PLAN.md §Linting, Decisions), and 120 is where only 34 lines stood over.
# Ruff's import sorting also wraps to this width when it rewrites an import.
line-length = 120

[tool.ruff.lint]
# A rule is switched on only at zero findings, in the PR that gets it there: no baseline file, and no
# mass `noqa`. A suppression names its code and gives a reason: `# noqa: F401 — why`, or
# `# type: ignore[code]  # why`. tests/test_project_rules.py checks the reason.
select = [
    "E4", "E7", "E9", "F",  # Ruff's default set (M167)
    "PGH003", "PGH004",     # no blanket `# type: ignore` or `# noqa`: name the code (M168)
    "RUF100",               # no `noqa` that suppresses nothing (M168)
    "T20",                  # no `print` in klarpdf/ (see per-file-ignores) (M168)
    "TID251",               # the banned APIs below (M168)
    # Defects that hide (M170): bugbear, which includes a `zip` that stops at the shorter list; an
    # `except` that catches every error, and one that drops it with `pass` or `continue`; and
    # Pylint's errors and warnings.
    "B", "BLE001", "S110", "S112", "PLE", "PLW",
    # A list paired with itself one along is `itertools.pairwise`. Without this, B905 would push a
    # neighbour pair towards `zip(strict=True)`, which fails on every call (M170).
    "RUF007",
    # Consistency (M171): imports in a fixed order; Python 3.11's syntax where older forms remain;
    # and no line over `line-length`. E741, which refuses a one-letter name such as `l`, is in E7.
    "I", "UP", "E501",
]

[tool.ruff.lint.per-file-ignores]
# stdout is the bridge's JSON-RPC stream, so `print` is banned in klarpdf/ only. The app, the tools
# and the tests print on purpose.
"!klarpdf/**" = ["T20"]
# The OS quarantine itself, and the places whose job is the OS: the installer and build scripts, the
# task runner, the dev tools, and the tests that check each platform's branch.
"platform_integration.py" = ["TID251"]
"packaging/**" = ["TID251"]
"tasks.py" = ["TID251"]
"tools/**" = ["TID251"]
"tests/**" = ["TID251"]
# The bridge's reference text for agents: Markdown served exactly as written. A Markdown table row
# must stay on one line, and seven of them are over 120 characters (M171).
"klarpdf/mcp_bridge/docs.py" = ["E501"]

# OS-specific calls, banned outside the quarantine (CLAUDE.md, Keep OS-specific code quarantined).
# Ruff reports an import of one of these and a use of it, so `sys.platform` in an `if` is caught too.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sys.platform".msg = "OS-specific code belongs in platform_integration.py (CLAUDE.md, Keep OS-specific code quarantined)"
"os.name".msg = "OS-specific code belongs in platform_integration.py (CLAUDE.md, Keep OS-specific code quarantined)"
"platform.system".msg = "OS-specific code belongs in platform_integration.py (CLAUDE.md, Keep OS-specific code quarantined)"
"os.startfile".msg = "OS-specific code belongs in platform_integration.py (CLAUDE.md, Keep OS-specific code quarantined)"
"winreg".msg = "OS-specific code belongs in platform_integration.py (CLAUDE.md, Keep OS-specific code quarantined)"
"ctypes.windll".msg = "OS-specific code belongs in platform_integration.py (CLAUDE.md, Keep OS-specific code quarantined)"
"ctypes.WinDLL".msg = "OS-specific code belongs in platform_integration.py (CLAUDE.md, Keep OS-specific code quarantined)"
"ctypes.wintypes".msg = "OS-specific code belongs in platform_integration.py (CLAUDE.md, Keep OS-specific code quarantined)"

# mypy, the type checker (M172). It checks klarpdf/, the wheel that both the app and the bridge
# stand on, and nothing else: whether the app is checked too is M173's decision. PLAN.md §M172 has
# the reasons. Like Ruff, it reports nothing on `main`, so an error is always the PR's own doing.
[tool.mypy]
# klarpdf/ is the wheel: the engine and the bridge. The rest is the desktop app's own code, the
# part with windows in it (M173). tests/test_lint_config.py fails if a shipped file is left out.
files = [
    "klarpdf",
    "app.py", "edit_commands.py", "launcher.py", "main_window.py", "platform_integration.py",
    "organize", "store", "ui", "viewer",
]
# The wheel's floor (`requires-python`). mypy then refuses syntax and library calls newer than 3.11,
# whichever Python runs it. tests/test_lint_config.py keeps this equal to the floor.
python_version = "3.11"
# A `# type: ignore[code]` that suppresses nothing is refused, as RUF100 refuses a stale `noqa`.
warn_unused_ignores = true
# Every function says what it takes and what it returns (M172.2). Without this, mypy skips the
# body of a function that has no annotations at all, and says nothing about it.
disallow_untyped_defs = true
# In klarpdf/ this changes nothing, because every function there is annotated. It is on for what it
# does to PyMuPDF, most of which is not annotated: mypy then reads an attribute's type from the
# value PyMuPDF's own code gives it. A rect's `x0` is a `float`, where it was unknown (M172.2).
check_untyped_defs = true

# A `tuple`, `dict` or `list` in a type says what it holds (M174). Without this, mypy checks nothing
# done with what is taken out of one. On for klarpdf/ so far: M174.3 adds the app, which moves it up
# to the settings above.
[[tool.mypy.overrides]]
module = ["klarpdf.*"]
disallow_any_generics = true


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
