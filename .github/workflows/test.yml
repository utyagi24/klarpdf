# Headless test suite (pytest) on every push to main + PR.
#
# Runs on Linux with **poppler-utils** installed, so the Poppler cross-engine redaction leak check
# (tests/test_redaction.py::test_redaction_leak_check_poppler_cross_engine) actually RUNS instead of
# skipping the way it does on a stock Windows/WSL shell with no pdftotext on PATH. The suite is
# offscreen (tests/conftest.py sets QT_QPA_PLATFORM=offscreen), so no display/xvfb is needed - only
# the Qt offscreen runtime libs.
#
# This is the project's first CI that runs the tests: release.yml only builds, audit.yml only scans.
name: test

on:
  push:
    branches: ["main"]
    paths-ignore: ["**.md"]   # docs-only changes don't affect tests
  # NO path filter on PRs, deliberately (G7). This job is a *required status check* on `main`, and a
  # required check is a gate — it must report "evaluated" on every PR, including docs-only ones. A
  # filtered-out workflow never creates a check run at all, and a ruleset cannot tell "not needed"
  # apart from "not finished yet": the PR would sit on "Expected — waiting for status" forever.
  # The docs-only decision therefore moves INSIDE the job (see the gate step) — which is also the only
  # place it can be expressed correctly. `paths: ["**.md"]` on a second workflow would be the obvious
  # alternative, but it means "ANY file is markdown", not "ALL files are" — a PR touching app.py *and*
  # README.md would fire both workflows and race two check runs called `pytest`.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # post the pass/fail comment on the PR

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the gate below diffs against the merge base

      # The docs-only gate. On a PR whose every changed file is markdown, the suite is not needed and
      # the honest result for this check is "evaluated, nothing to test" — the ~2 min of install+run is
      # skipped and `pytest` still reports success, so the ruleset is satisfied without a wedge.
      # Runs only for pull_request; on push/workflow_dispatch the output is empty and the suite runs.
      - name: Is this a docs-only change?
        id: gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")   # 3 dots = diff vs the merge base
          echo "Changed files:"; printf '%s\n' "$files"
          # docs-only iff the list is non-empty AND contains no line that fails to end in .md.
          # The -n guard matters: an empty list (no diff) must NOT count as docs-only — that is an
          # unexpected state, and the safe response is to run the suite.
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '\.md$'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "-> docs-only: skipping the suite, reporting the check as evaluated."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.docs_only != 'true'
        with:
          python-version: "3.12"

      - name: Install system deps (Poppler for the cross-engine check; Qt offscreen runtime)
        if: steps.gate.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 fontconfig

      - name: Install Python deps (cross-platform dev lock, no hashes)
        if: steps.gate.outputs.docs_only != 'true'
        run: pip install -r requirements-dev.txt

      - name: Run the headless suite
        if: steps.gate.outputs.docs_only != 'true'
        run: pytest -q --junit-xml=junit.xml   # conftest names every skip in the summary (M125)

      # A skipped test reports the same green tick as a passing one, so CI has to say out loud which
      # skips it is willing to accept. This pins the whole set rather than one dependency: an
      # ALLOWLIST OF REASONS, because a reason says *why* a test could not run, where a list of names
      # rots the moment a test is renamed and says nothing about a new one. Anything skipping for a
      # reason not listed here fails the build.
      #
      # It started life naming a single Poppler test while four were gated on `pdftotext`, so three
      # could have gone quiet in CI without failing anything. Generalising it removes that whole class
      # of gap: a missing dependency, a new `importorskip`, an environment probe that stops matching
      # — all of them now have to be justified here or they break the build.
      - name: Assert only the expected tests skipped (nothing went quiet)
        if: steps.gate.outputs.docs_only != 'true'
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          # The only skips this Linux runner may legitimately produce. Both are the Windows kernel
          # mutex, which genuinely cannot run here (tests/test_app_mutex.py) -- they are covered on a
          # developer's Windows machine instead. Everything else in the suite must RUN in CI: the
          # POSIX symlink tests, the off-Windows no-op, and the four Poppler cross-engine checks all
          # do, and each is a check whose whole value is that it ran.
          ALLOWED_REASONS = {"the mutex is a Windows kernel object"}

          root = ET.parse("junit.xml").getroot()
          unexpected = []
          for case in root.iter("testcase"):
              for skip in case.findall("skipped"):
                  reason = (skip.get("message") or "").strip()
                  if not any(allowed in reason for allowed in ALLOWED_REASONS):
                      unexpected.append((case.get("classname", ""), case.get("name", ""), reason))

          if unexpected:
              for classname, name, reason in unexpected:
                  print(f"UNEXPECTED SKIP  {classname}::{name} -- {reason}")
              raise SystemExit(
                  f"{len(unexpected)} test(s) skipped in CI for an unapproved reason. A skipped test "
                  "reports the same green tick as a passing one, so either fix the environment (a "
                  "missing system dependency is the usual cause) or add the reason to "
                  "ALLOWED_REASONS in this step, deliberately and with a comment saying why."
              )

          # A scan for skips also passes when there is nothing left to skip, so pin one test by name:
          # if it is renamed or deleted the guard must fail loudly instead of quietly proving nothing.
          CANARY = "test_redaction_leak_check_poppler_cross_engine"
          if not any(t.get("name") == CANARY for t in root.iter("testcase")):
              raise SystemExit(
                  f"{CANARY} is not in the results -- renamed or removed? Update this guard with it, "
                  "or it is checking nothing."
              )
          # Print what WAS skipped and why, not just a verdict. "3 skipped" in a summary is a puzzle
          # someone has to reverse-engineer from the runner image; naming them here answers it in the
          # log, forever, on the run that produced the number.
          accepted = [
              (case.get("classname", ""), case.get("name", ""), (skip.get("message") or "").strip())
              for case in root.iter("testcase")
              for skip in case.findall("skipped")
          ]
          for classname, name, reason in accepted:
              print(f"  expected skip  {classname}::{name} -- {reason}")
          print(f"OK: {len(accepted)} skip(s), all expected, and the canary is present.")
          PY

      # Post the result as a single, updated-in-place comment on the PR, so pass/fail is visible right
      # where you merge — a convenience on top of the check, not the check itself.
      #
      # It reports THIS JOB ONLY, and says so. The comment runs inside `pytest` and reads that job's
      # own junit.xml, but there are four test jobs now — `windows` (M123), `bridge` (M115.1) and
      # `bridge-windows` (M126) grew up around it. Until 2026-08-28 it was headed "Tests passed",
      # which read as *the suite* passed while measuring a quarter of it: three jobs could be red and
      # this comment would still show a tick, contradicting the merge state a reader was looking at it
      # to understand. Aggregating all four was considered and rejected — it needs artifact plumbing
      # and a fifth job, to improve a signal that is explicitly not allowed to gate anything (see the
      # `continue-on-error` note below), and it would have to distinguish "did not run" from "failed"
      # for two path-gated jobs. Naming the scope costs a string and is honest.
      - name: Comment the result on the PR
        # Nothing to report on a docs-only PR — the check itself says "evaluated"; a comment claiming
        # "0 passed" would be worse than silence.
        if: always() && github.event_name == 'pull_request' && steps.gate.outputs.docs_only != 'true'
        # This step MUST NOT be able to fail the job. `pytest` is a required status check on `main`
        # (G7 — PLAN.md §Public-release readiness), so a red job blocks the merge — and this step talks to the
        # GitHub REST API, which is the one part of this workflow that fails for reasons having nothing
        # to do with the code. Seen for real on 2026-07-16: the suite passed, `issues/N/comments`
        # returned a 503 HTML page during the "Degraded REST API Availability" incident, and the check
        # went red twice. A cosmetic comment must never gate a merge; the test result already lives in
        # the job's own steps, which do fail loudly and correctly.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-test-results -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            try {
              const xml = fs.readFileSync('junit.xml', 'utf8');
              const n = (re) => Number((xml.match(re) || [])[1] || 0);
              const tests = n(/tests="(\d+)"/), failures = n(/failures="(\d+)"/);
              const errors = n(/errors="(\d+)"/), skipped = n(/skipped="(\d+)"/);
              const passed = tests - failures - errors - skipped;
              const ok = failures === 0 && errors === 0;
              body = `${marker}\n### ${ok ? '✅ Linux suite passed' : '❌ Linux suite failed'}\n\n` +
                     `**${passed} passed**, ${failures} failed, ${errors} errors, ` +
                     `${skipped} skipped — [run details](${runUrl})\n\n` +
                     `<sub>This is the \`pytest\` job (ubuntu-latest) only. \`windows\`, \`bridge\` ` +
                     `and \`bridge-windows\` report separately — see the checks list. Counts differ ` +
                     `by platform on purpose: Windows skips the four Poppler-gated tests.</sub>`;
            } catch (e) {
              body = `${marker}\n### ⚠️ Linux suite did not run\n\n` +
                     `Setup failed before results were produced — [run details](${runUrl})`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const prev = comments.find(c => c.body && c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # ---------------------------------------------------------------------------------------------
  # M115.1 — run the bridge's OWN lock, which nothing had ever executed.
  #
  # The `pytest` job above installs requirements-dev.txt, which tracks the **app**. So every
  # tests/test_mcp_*.py has only ever run against the app's PyMuPDF, and the version the bridge
  # actually ships was never the version anything tested — which is how the app came to be on
  # pymupdf 1.27.2.3 while the bridge's lock said 1.28.2 for three months (M115). requirements-mcp.txt
  # was covered by the `audit` job the whole time, and auditing a lock for advisories is not the same
  # as running a line of code against it.
  #
  # M115 made a *version* drift impossible to commit: one declaration site (requirements-core.in) plus
  # two tests comparing the locks. Neither can see a *behaviour* difference between two engines, which
  # is the thing that actually hurts. Only running the bridge on its own dependencies can.
  #
  # NO PATH FILTER ON THE WORKFLOW, for the same reason the job above has none (G7): this is intended
  # as a required status check, and a filtered-out workflow never creates a check run at all — a
  # ruleset cannot tell "not needed" from "not finished", so the PR would wait on it forever. The
  # relevance decision therefore lives INSIDE the job, exactly like the docs-only gate above, and a
  # PR that cannot affect the bridge reports success without doing the work.
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the gate below diffs against the merge base

      # Which changes could alter what the bridge does? Its own code and lock, the shared core it
      # imports, and the packaging that generates its bundle. `model/` and `util/` are in the list
      # precisely because they are shared — that is the whole failure mode this job exists for.
      #
      # `requirements-win.txt` is deliberately NOT in the list, and the reason is worth stating: it
      # is the *app's* lock, so it cannot change what the bridge installs, and the invariant that
      # the two must agree on a shared library is already asserted unconditionally by
      # tests/test_mcp_packaging.py in the `pytest` job above. Adding it here would buy a second
      # check of something already checked on every PR.
      #
      # The gate is deliberately generous where it is cheap: a PR touching `model/` runs this even
      # though most such changes are GUI-only, because the cost of a needless 40-second job is
      # nothing next to the cost of the case it exists to catch.
      - name: Could this change affect the bridge?
        id: gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")   # 3 dots = diff vs the merge base
          echo "Changed files:"; printf '%s\n' "$files"
          # An EMPTY list must NOT count as irrelevant: no diff is an unexpected state, and the safe
          # response is to run. Same guard as the docs-only gate above, for the same reason.
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qE \
             '^(mcp_bridge/|model/|util/|packaging/mcp/mcpb/|tests/test_mcp_|requirements-(core|mcp)\.(in|txt)$|pyproject\.toml$|\.github/workflows/test\.yml$)'; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "-> nothing here reaches the bridge: reporting the check as evaluated."
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.relevant != 'false'
        with:
          python-version: "3.12"

      # The bridge is headless by design and must not need Qt — tests/test_mcp_no_qt.py asserts it.
      # Installing no Qt runtime here is therefore not an oversight but a second, independent proof:
      # if anything on the server path ever imports PySide6, this job fails to even collect.
      - name: Install the BRIDGE lock (not the dev lock — that is the point)
        if: steps.gate.outputs.relevant != 'false'
        run: |
          pip install -r requirements-mcp.txt
          pip install pytest        # the runner itself; deliberately not in the bridge's own lock
          python -c "import pymupdf; print('bridge engine ->', pymupdf.__doc__.splitlines()[0])"

      # pypdf is absent from this lock on purpose (M115). Under the dev lock it is installed anyway,
      # so a bridge path reaching PyPdfEngine passes there and fails on a user's machine; here that
      # mistake is a red check, because the import genuinely is not available.
      - name: Run the bridge suite against its own dependencies
        if: steps.gate.outputs.relevant != 'false'
        run: pytest -q tests/test_mcp_*.py

  # ---------------------------------------------------------------------------------------------
  # M126 — the same lock, on the platform that ships.
  #
  # `bridge` above proves requirements-mcp.txt resolves and behaves on Linux. RELEASE.md §7 exists
  # because that is not the interesting platform: the app ships Windows, `pipx install` is what the
  # bridge README tells a user to run, and "a lock that only resolves on one platform" is the defect
  # PLAN.md flags as expensive to discover late. Until now nothing checked it — the `windows` job
  # below installs requirements-dev.txt (the **app's** lock), so the bridge's own dependency set had
  # never been resolved on Windows by anything except a maintainer following the runbook by hand.
  #
  # NOT a matrix on the job above, and the reason is the ruleset rather than taste: `bridge` is a
  # REQUIRED status check by that exact name, and a matrix renames its checks to
  # `bridge (ubuntu-latest)` / `bridge (windows-latest)`. The required check `bridge` would then
  # never appear again, and — as the comment above says for path filters — a ruleset cannot tell
  # "not needed" from "not finished", so every PR would wait on it forever. A sibling job keeps the
  # existing check name untouched and costs one duplicated gate.
  #
  # Runs the suite rather than stopping at the install, for M115.1's reason applied per-platform: a
  # resolve proves the wheels exist, and only running the code can see a behaviour difference.
  bridge-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # one script for both jobs; Git Bash ships on the runner
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the gate below diffs against the merge base

      # Deliberately the same gate as `bridge` — same files, same generosity, same empty-diff rule.
      - name: Could this change affect the bridge?
        id: gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")   # 3 dots = diff vs the merge base
          echo "Changed files:"; printf '%s\n' "$files"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qE \
             '^(mcp_bridge/|model/|util/|packaging/mcp/mcpb/|tests/test_mcp_|requirements-(core|mcp)\.(in|txt)$|pyproject\.toml$|\.github/workflows/test\.yml$)'; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "-> nothing here reaches the bridge: reporting the check as evaluated."
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.relevant != 'false'
        with:
          python-version: "3.12"

      # The step RELEASE.md §7 was written for. If a wheel in this lock has no win_amd64 build, or a
      # marker excludes one, the failure is here on a PR rather than on a user's machine.
      - name: Install the BRIDGE lock on Windows (this is the check)
        if: steps.gate.outputs.relevant != 'false'
        run: |
          pip install -r requirements-mcp.txt
          pip install pytest        # the runner itself; deliberately not in the bridge's own lock
          python -c "import pymupdf; print('bridge engine ->', pymupdf.__doc__.splitlines()[0])"

      # No Poppler here, like the `windows` job below: the four pdftotext-gated tests run on Linux,
      # and this job exists for what Linux cannot answer.
      - name: Run the bridge suite against its own dependencies
        if: steps.gate.outputs.relevant != 'false'
        run: pytest -q tests/test_mcp_*.py

  # ---------------------------------------------------------------------------------------------
  # M132 — the Python version window, tested at both ends instead of declared.
  #
  # `pyproject.toml` says `requires-python = ">=3.11,<3.15"`. Before M132 it said `>=3.12,<3.13` —
  # a one-version window that made "have exactly 3.12" a prerequisite for every bridge user, and
  # which nothing in the dependency set had ever asked for. Widening it is only honest if something
  # runs the code on the versions now being promised: the old window was at least *true*, because
  # 3.12 is what every job here uses.
  #
  # So this job is the widening's other half. `bridge` above proves the lock resolves and behaves on
  # 3.12; this proves the same for 3.11 and for the two versions above it, and
  # `test_the_ci_matrix_covers_every_python_the_window_claims` fails if the two ever disagree —
  # widening the window without adding a runner breaks the build rather than shipping a guess.
  #
  # A SIBLING JOB, NOT A MATRIX ON `bridge`, for the reason `bridge-windows` records above: `bridge`
  # is a REQUIRED status check by that exact name, and adding a matrix to it renames its checks to
  # `bridge (3.12)`, so the required check never reports again and every PR waits forever. The
  # matrix lives here, where no ruleset is watching the name.
  #
  # 3.12 is deliberately absent from the matrix: `bridge` and `bridge-windows` already run that
  # version, and duplicating it would buy a third copy of covered ground on every PR.
  bridge-pyver:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # "3.11 broke and 3.14 is fine" is the useful answer; stopping at the first hides it
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the gate below diffs against the merge base

      # The same gate as `bridge`, and the same file list, for the same reason — see that job.
      - name: Could this change affect the bridge?
        id: gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")   # 3 dots = diff vs the merge base
          echo "Changed files:"; printf '%s\n' "$files"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qE \
             '^(mcp_bridge/|model/|util/|packaging/mcp/mcpb/|tests/test_mcp_|requirements-(core|mcp)\.(in|txt)$|pyproject\.toml$|\.github/workflows/test\.yml$)'; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "-> nothing here reaches the bridge: reporting the check as evaluated."
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.relevant != 'false'
        with:
          python-version: ${{ matrix.python-version }}

      # requirements-mcp.txt carries `==` pins compiled on 3.12. They are not version-conditional, so
      # this step is a real check and not a formality: a pin whose wheel does not exist for this
      # interpreter fails HERE, on a PR, rather than on the machine of a user whose Python we
      # promised to support.
      - name: Install the BRIDGE lock on this Python (this is the check)
        if: steps.gate.outputs.relevant != 'false'
        run: |
          python -VV
          pip install -r requirements-mcp.txt
          pip install pytest        # the runner itself; deliberately not in the bridge's own lock
          python -c "import pymupdf; print('bridge engine ->', pymupdf.__doc__.splitlines()[0])"

      # Installing is not the interesting half. `model/` and `util/` are shared with the GUI and have
      # only ever been executed on 3.12; a behaviour difference across versions — a dict ordering
      # assumption, a changed stdlib default — is invisible to a resolve and shows up here.
      - name: Run the bridge suite against its own dependencies
        if: steps.gate.outputs.relevant != 'false'
        run: pytest -q tests/test_mcp_*.py

  # M123 — the Windows half of the suite, which nothing had ever run.
  #
  # `pytest` above is Linux, and two tests can only run here: `tests/test_app_mutex.py`'s
  # single-instance cases, gated on `sys.platform == "win32"` because the mutex is a Windows kernel
  # object. Single-instance/focus is a **shipped Windows feature**, so until now its only coverage was
  # a maintainer remembering to run the suite locally before tagging — `release.yml` uses
  # `windows-latest` but only builds, and runs no tests at all.
  #
  # Free, despite the folklore: GitHub bills standard runners at 2x on Windows only for PRIVATE repos
  # drawing down included minutes. This repo is public, where standard runners are unmetered — the
  # `windows-latest` job in release.yml has been proving that on every release.
  #
  # NO PATH FILTER, and the docs-only gate lives inside the job, for the same reason as the two jobs
  # above (G7): this is intended as a required status check, and a filtered-out workflow never creates
  # a check run, which a ruleset cannot tell apart from one still running.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the gate below diffs against the merge base

      - name: Is this a docs-only change?
        id: gate
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          echo "Changed files:"; printf '%s\n' "$files"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '\.md$'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "-> docs-only: skipping the suite, reporting the check as evaluated."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.docs_only != 'true'
        with:
          python-version: "3.12"

      - name: Install Python deps (cross-platform dev lock, no hashes)
        if: steps.gate.outputs.docs_only != 'true'
        run: pip install -r requirements-dev.txt

      # Deliberately NO Poppler here. The four `pdftotext`-gated tests already run on Linux, and this
      # job exists for what Linux CANNOT run. Installing it would buy a duplicate of covered ground and
      # slow every PR; the allowlist below is what states that choice rather than leaving it implied.
      - name: Run the headless suite
        if: steps.gate.outputs.docs_only != 'true'
        run: pytest -q --junit-xml=junit.xml   # conftest names every skip in the summary (M125)

      # The mirror image of the Linux allowlist. There the Windows mutex tests are the approved skip;
      # here they are the whole point of the job, so they must RUN and the platform-inverted ones are
      # what may skip. Stating both sides is what makes "covered somewhere" checkable instead of
      # assumed: between the two jobs, every skip in the suite is expected on exactly one platform.
      - name: Assert only the expected tests skipped (the Windows-only tests really ran)
        if: steps.gate.outputs.docs_only != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          # Legitimate skips on a Windows runner: the POSIX-only tests, and Poppler, which this job
          # deliberately does not install (see above). Everything else must run.
          ALLOWED_REASONS = {
              "POSIX symlink semantics",
              "off-Windows it must be an inert no-op",
              "Poppler pdftotext not installed",
          }

          root = ET.parse("junit.xml").getroot()
          unexpected = []
          for case in root.iter("testcase"):
              for skip in case.findall("skipped"):
                  reason = (skip.get("message") or "").strip()
                  if not any(allowed in reason for allowed in ALLOWED_REASONS):
                      unexpected.append((case.get("classname", ""), case.get("name", ""), reason))

          if unexpected:
              for classname, name, reason in unexpected:
                  print(f"UNEXPECTED SKIP  {classname}::{name} -- {reason}")
              raise SystemExit(
                  f"{len(unexpected)} test(s) skipped on Windows for an unapproved reason. Either fix "
                  "the environment or add the reason to ALLOWED_REASONS in this step, deliberately "
                  "and with a comment saying why."
              )

          # The reason this job exists, named individually and on purpose. "Some test_app_mutex case
          # ran" is not enough: that file also holds platform-neutral cases which run everywhere, so a
          # count would stay green while these two -- the only ones gated on `sys.platform == "win32"`
          # -- skipped and went back to running NOWHERE. Naming them is the same trade as the canary
          # on the Linux job: coupled to a rename, which fails loudly, rather than to nothing at all.
          MUST_RUN = {
              "test_acquire_is_idempotent_and_holds_a_handle_windows_only",
              "test_the_mutex_is_visible_to_another_opener_which_is_what_inno_does_windows_only",
          }
          ran = {
              case.get("name")
              for case in root.iter("testcase")
              if case.get("name") in MUST_RUN and not case.findall("skipped")
          }
          if ran != MUST_RUN:
              missing = ", ".join(sorted(MUST_RUN - ran)) or "(none)"
              raise SystemExit(
                  f"these Windows-only tests did not run here: {missing}. They skip on Linux by "
                  "design, so this job is the only thing standing between them and no coverage at "
                  "all. If one was renamed, update MUST_RUN in this step."
              )
          # Name what was skipped and why. This runner's skip count is NOT the same as a developer's
          # Windows box: the hosted image happens to carry `pdftotext`, so the four Poppler-gated
          # tests RUN here and skip locally -- which is why CI shows 3 where a local run shows 7.
          # Printing them turns that surprise into a fact the log states.
          accepted = [
              (case.get("classname", ""), case.get("name", ""), (skip.get("message") or "").strip())
              for case in root.iter("testcase")
              for skip in case.findall("skipped")
          ]
          for classname, name, reason in accepted:
              print(f"  expected skip  {classname}::{name} -- {reason}")
          print(f"OK: {len(accepted)} skip(s), all expected; both Windows-only mutex tests ran ({len(ran)}/2).")
          PY
